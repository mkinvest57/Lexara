version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lingq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingq
      POSTGRES_PASSWORD: lingq_dev_password
      POSTGRES_DB: lingq_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lingq']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
